<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>分心緩衝器</title><link rel="stylesheet" href="popup.css"></head><body><main class="popup"><header class="header"><div class="brand-mark">FB</div><div><h1>分心緩衝器</h1><p>打開容易分心的網站前，先停下來想一下。</p></div></header><section class="permission-card"><h2>啟用網站提醒</h2><p>Safari 需要你授權擴充功能讀取清單中的網站，才能顯示提醒畫面。</p><button id="grant-all" class="button primary" type="button">授權清單中的網站</button><p id="permission-message" class="status" role="status"></p></section><section class="section"><h2>新增網站或頁面</h2><form id="add-form" class="add-form"><label class="sr-only" for="target-input">網站網域或完整網址</label><input id="target-input" placeholder="reddit.com 或 https://example.com/path" autocapitalize="none" spellcheck="false"><button class="button primary">新增</button></form><button id="add-current" class="button secondary current">封鎖目前 Safari 網站</button><p id="form-message" class="status" role="status"></p></section><section class="section"><div class="section-heading"><h2>封鎖清單</h2><span id="target-count" class="count">0</span></div><ul id="target-list" class="target-list"></ul></section><section class="section settings"><h2>使用時間</h2><form id="limit-form"><label for="limit-input">按下「我真的要繼續」後，幾分鐘自動關閉分頁</label><div class="setting-row"><input id="limit-input" type="number" min="1" max="180" step="1"><span>分鐘</span><button class="button secondary">儲存</button></div><p id="limit-message" class="status" role="status"></p></form></section><footer>設定與使用時間只儲存在這台裝置，不會上傳。</footer></main><script src="popup.js"></script></body></html>
