<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <img src="../Icon.png" width="64" height="64" alt="">
            <h1>先緩緩</h1>
            <p class="lead state-unknown">在 Safari 打開延伸功能就能開始用。</p>
            <p class="lead state-on">延伸功能已經打開了。</p>
            <p class="lead state-off">延伸功能還沒打開。</p>
        </header>

        <ol class="steps">
            <li>
                <span class="step-number">1</span>
                <p>在 Safari 設定的「延伸功能」打開「先緩緩」</p>
            </li>
            <li>
                <span class="step-number">2</span>
                <p>點 Safari 工具列上的逗點圖示。找不到的話，到「顯示方式 › 自訂工具列」把它拖上去</p>
            </li>
            <li>
                <span class="step-number">3</span>
                <p>按「授權清單中的網站」，Safari 詢問時選「一律允許」</p>
            </li>
            <li>
                <span class="step-number">4</span>
                <p>打開清單裡的網站試試</p>
            </li>
        </ol>

        <button class="open-preferences" type="button">結束並打開 Safari 設定…</button>
    </main>
</body>
</html>
